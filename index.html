<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="خرج‌یار — مدیریت هزینه، درآمد و بودجه شخصی">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#00897b">
  <meta name="apple-mobile-web-app-title" content="خرج‌یار">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>خرج‌یار</title>
  <style>
    :root { --bg: #f4f7f6; --fg: #17312c; --muted: #5d736e; --accent: #00897b; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1716; --fg: #e3efec; --muted: #93aaa5; --accent: #4db6ac; color-scheme: dark } }
    :root[data-theme="dark"] { --bg: #0f1716; --fg: #e3efec; --muted: #93aaa5; --accent: #4db6ac; color-scheme: dark }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font-family: Tahoma, system-ui, sans-serif; direction: rtl; text-align: center; padding: 16px; }
    #loader b { font-size: 22px; }
    #loader span { color: var(--muted); font-size: 13px; }
    .ring { width: 38px; height: 38px; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="loader"><div class="ring"></div><b>خرج‌یار</b><span>در حال بارگذاری… (بار اول چند ثانیه طول می‌کشد)</span></div>
  <script>window.addEventListener('flutter-first-frame', function () { var l = document.getElementById('loader'); if (l) l.remove(); });</script>
  <script src="flutter_bootstrap.js" async></script>
  <script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); }); }</script>
</body>
</html>
